<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="8" fill="#0A2C42"/>
  <!-- grid lines -->
  <g stroke="#5CB3DE" stroke-width="3" stroke-dasharray="4 3" stroke-linecap="round">
    <line x1="23" y1="10" x2="23" y2="54"/>
    <line x1="41" y1="10" x2="41" y2="54"/>
    <line x1="10" y1="23" x2="54" y2="23"/>
    <line x1="10" y1="41" x2="54" y2="41"/>
  </g>
  <!-- X mark (top-left cell) -->
  <g stroke="#E8722C" stroke-width="4" stroke-linecap="round">
    <line x1="13" y1="13" x2="20" y2="20"/>
    <line x1="20" y1="13" x2="13" y2="20"/>
  </g>
  <!-- O mark (center cell) -->
  <circle cx="32" cy="32" r="6" fill="none" stroke="#EAF4FA" stroke-width="4"/>
  <!-- X mark (bottom-right cell) -->
  <g stroke="#E8722C" stroke-width="4" stroke-linecap="round">
    <line x1="44" y1="44" x2="51" y2="51"/>
    <line x1="51" y1="44" x2="44" y2="51"/>
  </g>
  <!-- corner crosshair accents -->
  <g stroke="#5CB3DE" stroke-width="2">
    <line x1="4" y1="4" x2="9" y2="4"/>
    <line x1="4" y1="4" x2="4" y2="9"/>
    <line x1="55" y1="60" x2="60" y2="60"/>
    <line x1="60" y1="55" x2="60" y2="60"/>
  </g>
</svg>
