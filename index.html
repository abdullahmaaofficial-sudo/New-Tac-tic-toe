<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIC-TAC-TOE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="EndScreen" id="endscreen">
        <div class="screen-box">
            <span class="chip">GAME OVER</span>
            <h1 id="h1"></h1>
            <button id="restart">Play Again</button>
        </div>
    </div>

    <div class="game_option" id="game_option">
        <p class="eyebrow">chalkboard tic-tac-toe</p>
        <h1 class="title">Three in a Row</h1>
        <p class="subtitle">Pick how you want to play</p>
        <div class="option-row">
            <button id="userAnduser" class="game-type">Player vs Player</button>
            <span class="vs-divider">or</span>
            <button id="userAndsys" class="game-type">Player vs System</button>
        </div>
    </div>

    <header>
        <span class="turn-label">now playing</span>
        <h1 id="turn"></h1>
    </header>
    <main>
        <div class="board-frame">
            <span class="tape tape-left"></span>
            <span class="tape tape-right"></span>
            <div class="board">
                <div id="box1" class="boxes">1</div>
                <div id="box2" class="boxes">2</div>
                <div id="box3" class="boxes">3</div>
                <div id="box4" class="boxes">4</div>
                <div id="box5" class="boxes">5</div>
                <div id="box6" class="boxes">6</div>
                <div id="box7" class="boxes">7</div>
                <div id="box8" class="boxes">8</div>
                <div id="box9" class="boxes">9</div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
